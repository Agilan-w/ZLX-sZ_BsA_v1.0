[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zlx-cde-v2.5"
version = "0.1.0"
description = "RLCD fine-tuning pipeline for calibrated decisions on Laya / ModernBERT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "ZLX-CDE V2.5" },
]
keywords = [
    "deep-learning",
    "calibration",
    "reinforcement-learning",
    "rlcd",
    "modernbert",
    "laya",
    "brier-score",
    "pytorch",
    "selective-classification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0,<3.0.0",
    "transformers>=4.48.0,<5.0.0",
    "accelerate>=0.28.0,<1.0.0",
    "torchmetrics>=1.3.0,<2.0.0",
    "datasets>=2.18.0,<3.0.0",
    "numpy>=2.0.0,<2.3.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "wandb>=0.16.0,<1.0.0",
    "flash-attn>=2.5.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
zlx-train = "zoul_rlcd.train:main"
zlx-evaluate = "zoul_rlcd.evaluate:main"
zlx-predict = "zoul_rlcd.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zoul_rlcd*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
